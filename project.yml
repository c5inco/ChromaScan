name: ChromaScan
options:
  bundleIdPrefix: com.chromascan
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    DEAD_CODE_STRIPPING: YES

targets:
  ChromaScan:
    type: application
    platform: macOS
    sources:
      - path: Sources/Core
      - path: Sources/MacHost
      - path: Resources/Assets.xcassets
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: ChromaScan
        CFBundleDisplayName: ChromaScan
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0.0"
        CFBundlePackageType: APPL
        LSMinimumSystemVersion: "14.0"
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
        NSLocalNetworkUsageDescription: "ChromaScan discovers Wi-Fi eSCL scanners and pairs with the ChromaScan iPhone Companion on your local network."
        NSBonjourServices:
          - "_uscan._tcp"
          - "_uscans._tcp"
          - "_chromascan._tcp"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ChromaScanTeamID: $(CHROMASCAN_TEAM_ID)
        ChromaScanCompanionBundleID: $(CHROMASCAN_BUNDLE_ID_PREFIX).remote
    settings:
      base:
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ENABLE_HARDENED_RUNTIME: NO
        DEVELOPMENT_TEAM: $(CHROMASCAN_TEAM_ID)
        CODE_SIGN_IDENTITY: $(CHROMASCAN_MAC_CODE_SIGN_IDENTITY)
        PRODUCT_BUNDLE_IDENTIFIER: $(CHROMASCAN_BUNDLE_ID_PREFIX).app
        INFOPLIST_FILE: Resources/Info.plist
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  ChromaScanRemote:
    type: application
    platform: iOS
    sources:
      - path: Sources/Core
      - path: Sources/iOSCompanion
      - path: Resources/Assets.xcassets
    dependencies:
      - target: ChromaScanWidgets
        embed: true
    info:
      path: Resources/iOSInfo.plist
      properties:
        CFBundleDisplayName: ChromaScan
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        NSSupportsLiveActivities: true
        NSLocalNetworkUsageDescription: "ChromaScan Companion discovers and connects to your Mac running ChromaScan on your local network."
        NSBonjourServices:
          - "_chromascan._tcp"
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSPhotoLibraryAddUsageDescription: "ChromaScan Companion saves Display P3 copies of scans to your Photos library when requested."
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ChromaScanTeamID: $(CHROMASCAN_TEAM_ID)
    settings:
      base:
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        DEVELOPMENT_TEAM: $(CHROMASCAN_TEAM_ID)
        CODE_SIGN_IDENTITY: Apple Development
        PRODUCT_BUNDLE_IDENTIFIER: $(CHROMASCAN_BUNDLE_ID_PREFIX).remote
        PRODUCT_NAME: ChromaScanRemote
        INFOPLIST_FILE: Resources/iOSInfo.plist
        CODE_SIGN_ENTITLEMENTS: $(CHROMASCAN_IOS_ENTITLEMENTS)
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO

  ChromaScanWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/Core/ChromaTheme.swift
      - path: Sources/Core/ScanLiveActivityAttributes.swift
      - path: Sources/Widgets
      - path: Resources/WidgetsAssets.xcassets
    info:
      path: Resources/WidgetsInfo.plist
      properties:
        CFBundleDisplayName: ChromaScan Live Activity
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        DEVELOPMENT_TEAM: $(CHROMASCAN_TEAM_ID)
        CODE_SIGN_IDENTITY: Apple Development
        PRODUCT_BUNDLE_IDENTIFIER: $(CHROMASCAN_BUNDLE_ID_PREFIX).remote.widgets
        PRODUCT_NAME: ChromaScanWidgets
        INFOPLIST_FILE: Resources/WidgetsInfo.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SKIP_INSTALL: YES
        GENERATE_INFOPLIST_FILE: NO

  ChromaScanTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/MacTests
    dependencies:
      - target: ChromaScan
    settings:
      base:
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        DEVELOPMENT_TEAM: $(CHROMASCAN_TEAM_ID)
        CODE_SIGN_IDENTITY: $(CHROMASCAN_MAC_CODE_SIGN_IDENTITY)
        PRODUCT_BUNDLE_IDENTIFIER: $(CHROMASCAN_BUNDLE_ID_PREFIX).tests
        GENERATE_INFOPLIST_FILE: YES

  ChromaScanRemoteTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/iOSTests
    dependencies:
      - target: ChromaScanRemote
    settings:
      base:
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        DEVELOPMENT_TEAM: $(CHROMASCAN_TEAM_ID)
        PRODUCT_BUNDLE_IDENTIFIER: $(CHROMASCAN_BUNDLE_ID_PREFIX).remote.tests
        GENERATE_INFOPLIST_FILE: YES
